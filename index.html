
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, My Love!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: "Trebuchet MS", sans-serif;
            background: linear-gradient(135deg, #ffe1ec, #fff3f6, #fbd0e4);
            color: #c43c70;
        }

        .birthday-card {
            padding: 30px 20px;
            width: 90%;
            max-width: 600px;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: clamp(2.3rem, 8vw, 4rem);
            margin: 15px 0;
            animation: appear 1.5s ease;
        }

        .cake {
            font-size: 110px;
            animation: bounce 2s infinite;
        }

        p {
            font-size: 1.2rem;
            color: #a14d70;
        }

        button {
            margin-top: 20px;
            padding: 14px 35px;
            border: none;
            border-radius: 30px;
            background: #ed77a6;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 15px #e9a0bd;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            background: #d9578c;
        }

        .balloon {
            position: absolute;
            bottom: -160px;
            font-size: 65px;
            animation: fly 8s linear infinite;
            z-index: 1;
        }

        .b1 { left: 8%; animation-delay: 0s; }
        .b2 { left: 27%; animation-delay: 2s; }
        .b3 { left: 68%; animation-delay: 1s; }
        .b4 { left: 88%; animation-delay: 3s; }

        @keyframes fly {
            0% { transform: translateY(0) rotate(-10deg); }
            100% { transform: translateY(-125vh) rotate(15deg); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .confetti {
            position: absolute;
            top: -20px;
            animation: fall 4s linear infinite;
            font-size: 22px;
        }

        @keyframes fall {
            to { transform: translateY(115vh) rotate(720deg); }
        }
    </style>
</head>

<body>

    <div class="balloon b1">🎈</div>
    <div class="balloon b2">🎈</div>
    <div class="balloon b3">🎈</div>
    <div class="balloon b4">🎈</div>

    <main class="birthday-card">
        <div class="cake">🎂</div>

        <h1>HAPPY BIRTHDAY!</h1>

        <p>To my favourite person in the whole world. 💗</p>

        <p>Today is all about you. 🎀</p>

        <button onclick="goNext()">click here →</button>
    </main>

    <script>
        function goNext() {
            window.location.href = "page2.html";
        }

        const decorations = ["💗", "✨", "🎉", "💕", "🎊"];

        for (let i = 0; i < 25; i++) {
            const piece = document.createElement("div");
            piece.className = "confetti";
            piece.textContent =
                decorations[Math.floor(Math.random() * decorations.length)];

            piece.style.left = Math.random() * 100 + "vw";
            piece.style.animationDelay = Math.random() * 4 + "s";
            piece.style.animationDuration = (3 + Math.random() * 4) + "s";

            document.body.appendChild(piece);
        }
    </script>

</body>
</html>
